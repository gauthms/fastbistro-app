services:
  postgres:
    image: postgres:17

    container_name: fastbistro-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: fastbistro
      POSTGRES_PASSWORD: fastbistro
      POSTGRES_DB: fastbistro

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: fastbistro-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fastbistro:fastbistro@postgres:5432/fastbistro
    depends_on:
      - postgres


volumes:
  postgres_data: