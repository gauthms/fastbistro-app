services:
  postgres:
    image: postgres:17

    container_name: fastbistro-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: fastbistro
      POSTGRES_PASSWORD: fastbistro
      POSTGRES_DB: fastbistro

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: